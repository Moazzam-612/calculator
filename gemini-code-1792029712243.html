<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Glassmorphism Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-hover {
            transition: all 0.15s ease;
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }
        .btn-hover:active {
            transform: translateY(1px);
        }

        /* Custom Scrollbar for History */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-md glass rounded-3xl shadow-2xl overflow-hidden p-6 text-white">
        
        <!-- Top Bar: Mode & History Toggle -->
        <div class="flex justify-between items-center mb-4 text-sm text-gray-300">
            <span class="font-semibold tracking-wider text-purple-400"><i class="fa-solid fa-calculator ml-1"></i> ADVANCED CALC</span>
            <button onclick="toggleHistory()" class="hover:text-white transition bg-white/10 px-3 py-1 rounded-full text-xs flex items-center gap-1">
                <i class="fa-solid fa-clock-rotate-left"></i> History
            </button>
        </div>

        <!-- Display Screen -->
        <div class="glass rounded-2xl p-4 mb-6 text-right shadow-inner border border-white/10 relative min-h-[110px] flex flex-col justify-end">
            <div id="previous-operation" class="text-xs text-gray-400 font-mono tracking-wider min-h-[18px] truncate"></div>
            <div id="current-display" class="text-3xl sm:text-4xl font-bold tracking-tight font-mono overflow-x-auto whitespace-nowrap">0</div>
        </div>

        <!-- Keypad Grid -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Row 1: Scientific/Extras -->
            <button onclick="clearAll()" class="glass btn-hover text-rose-400 font-semibold py-3 rounded-xl text-sm">AC</button>
            <button onclick="deleteDigit()" class="glass btn-hover text-amber-400 font-semibold py-3 rounded-xl text-sm"><i class="fa-solid fa-delete-left"></i></button>
            <button onclick="appendOperator('%')" class="glass btn-hover text-purple-300 font-semibold py-3 rounded-xl text-sm">%</button>
            <button onclick="appendOperator('/')" class="glass btn-hover text-purple-400 font-semibold py-3 rounded-xl text-lg">÷</button>

            <!-- Row 2: Scientific & Numbers -->
            <button onclick="appendFunction('Math.sin')" class="glass btn-hover text-gray-300 text-xs py-3 rounded-xl font-medium">sin</button>
            <button onclick="appendValue('7')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">7</button>
            <button onclick="appendValue('8')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">8</button>
            <button onclick="appendValue('9')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">9</button>

            <!-- Row 3 -->
            <button onclick="appendFunction('Math.cos')" class="glass btn-hover text-gray-300 text-xs py-3 rounded-xl font-medium">cos</button>
            <button onclick="appendValue('4')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">4</button>
            <button onclick="appendValue('5')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">5</button>
            <button onclick="appendValue('6')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">6</button>

            <!-- Row 4 -->
            <button onclick="appendFunction('Math.tan')" class="glass btn-hover text-gray-300 text-xs py-3 rounded-xl font-medium">tan</button>
            <button onclick="appendValue('1')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">1</button>
            <button onclick="appendValue('2')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">2</button>
            <button onclick="appendValue('3')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">3</button>

            <!-- Row 5 -->
            <button onclick="appendFunction('Math.sqrt')" class="glass btn-hover text-gray-300 text-xs py-3 rounded-xl font-medium">√</button>
            <button onclick="appendValue('0')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">0</button>
            <button onclick="appendValue('.')" class="glass btn-hover bg-white/10 font-semibold py-3 rounded-xl text-lg">.</button>
            <button onclick="calculateResult()" class="btn-hover bg-gradient-to-r from-purple-600 to-indigo-600 font-bold py-3 rounded-xl text-xl shadow-lg shadow-purple-900/50">=</button>
        </div>

        <!-- Extra Scientific Quick Row -->
        <div class="grid grid-cols-4 gap-3 mt-3">
            <button onclick="appendOperator('*')" class="glass btn-hover text-purple-400 font-semibold py-2.5 rounded-xl text-sm">×</button>
            <button onclick="appendOperator('-')" class="glass btn-hover text-purple-400 font-semibold py-2.5 rounded-xl text-sm">-</button>
            <button onclick="appendOperator('+')" class="glass btn-hover text-purple-400 font-semibold py-2.5 rounded-xl text-sm">+</button>
            <button onclick="appendPower()" class="glass btn-hover text-purple-300 font-semibold py-2.5 rounded-xl text-xs">x^y</button>
        </div>
    </div>

    <!-- History Modal / Drawer -->
    <div id="history-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-sm rounded-3xl p-6 border border-white/20 shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                <h3 class="font-bold text-lg text-purple-300"><i class="fa-solid fa-history ml-2"></i> Calculation History</h3>
                <button onclick="toggleHistory()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="history-list" class="flex-grow overflow-y-auto space-y-2 pr-1 text-sm text-gray-300">
                <p class="text-center text-gray-500 py-4">No history yet</p>
            </div>
            <button onclick="clearHistory()" class="mt-4 bg-rose-600/30 hover:bg-rose-600/50 text-rose-300 py-2 rounded-xl text-xs transition font-semibold">Clear History</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentInput = '0';
        let previousInput = '';
        let history = [];

        const currentDisplay = document.getElementById('current-display');
        const previousDisplay = document.getElementById('previous-operation');
        const historyModal = document.getElementById('history-modal');
        const historyList = document.getElementById('history-list');

        function updateDisplay() {
            currentDisplay.innerText = currentInput;
            previousDisplay.innerText = previousInput;
        }

        function appendValue(val) {
            if (currentInput === '0' && val !== '.') {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            currentInput += ` ${op} `;
            updateDisplay();
        }

        function appendFunction(func) {
            currentInput += `${func}(`;
            updateDisplay();
        }

        function appendPower() {
            currentInput += `**`;
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            updateDisplay();
        }

        function deleteDigit() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function calculateResult() {
            try {
                previousInput = currentInput;
                // Safely evaluate standard math expressions
                let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
                let result = eval(sanitized);
                
                // Format floating numbers cleanly
                result = parseFloat(result.toFixed(6));
                
                // Add to history
                history.unshift({ expression: currentInput, result: result });
                if(history.length > 20) history.pop();
                renderHistory();

                currentInput = result.toString();
                updateDisplay();
            } catch (error) {
                currentInput = 'Error';
                updateDisplay();
                setTimeout(clearAll, 1200);
            }
        }

        function toggleHistory() {
            historyModal.classList.toggle('hidden');
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<p class="text-center text-gray-500 py-4">No history yet</p>';
                return;
            }
            historyList.innerHTML = history.map(item => `
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 flex justify-between items-center">
                    <span class="text-gray-400 font-mono">${item.expression}</span>
                    <span class="text-purple-300 font-bold font-mono">= ${item.result}</span>
                </div>
            `).join('');
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                appendValue(e.key);
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                appendOperator(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                calculateResult();
            } else if (e.key === 'Backspace') {
                deleteDigit();
            } else if (e.key === 'Escape') {
                clearAll();
            }
        });
    </script>
</body>
</html>
